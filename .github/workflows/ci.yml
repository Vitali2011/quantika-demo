name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: previously had paths-ignore for docs/**, *.md, .claude/**, .specs/**, README*, *.svg —
# removed 2026-05-20 because (a) repo is now public → CI minutes are free, and (b) branch
# protection requires Build/Test/TypeCheck as Required status checks, so docs-only PRs
# were stuck "Expected — Waiting for status to be reported" and could only merge via
# admin-bypass click. Running full CI on docs PRs is cheap and unblocks the merge flow.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeCheck + Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: npm run lint
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm audit --audit-level=high
        if: github.event_name == 'push'
        continue-on-error: true

  test:
    # When this job exceeds ~8 minutes, shard it via matrix strategy (jest --shard=N/M).
    # Current runtime: ~3 min — sharding is premature at this scale (YAGNI).
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # E2E moved to .github/workflows/e2e.yml (manual + weekly cron, 2026-05-15)
  # Reason: e2e had continue-on-error=true, blocked nothing, but added ~15-20 min to every push to main.
  # Now run via Actions UI "Run workflow" or auto Monday 04:00 UTC.

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
