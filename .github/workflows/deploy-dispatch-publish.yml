name: Deploy request publisher

on:
  workflow_run:
    workflows: [Deploy request collector]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-dispatch-publisher-quantika-demo
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false

      - name: Download collector artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name deployment-request \
            --dir "$RUNNER_TEMP/deployment-request"

      - name: Revalidate deployment request
        id: request
        run: |
          request="$RUNNER_TEMP/deployment-request/deployment-request.json"
          if jq -e '.deploy == false and .reason == "docs-only"' "$request" >/dev/null; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '.event_type' "$request")" = prod-deploy
          test "$(jq -r 'keys | sort | join(",")' "$request")" = client_payload,event_type
          payload="$(jq -c '.client_payload' "$request")"
          sha="$(python3 ops/deploy_contract.py validate-request \
            --expected-service quantika-demo \
            --payload-json "$payload")"
          test -n "$sha"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"

      - name: Publish canonical deployment request
        if: steps.request.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_REBASE_PAT }}
        run: |
          test -n "$GH_TOKEN"
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            --input "$RUNNER_TEMP/deployment-request/deployment-request.json"
