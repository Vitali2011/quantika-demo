name: Deploy request collector

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-dispatch-collector-quantika-demo
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false

      - name: Read changed paths from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          test -s "$RUNNER_TEMP/changed-files.txt"

      - name: Build closed deployment request
        run: |
          python3 ops/deploy_contract.py build-dispatch \
            --service quantika-demo \
            --event "$GITHUB_EVENT_PATH" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            > "$RUNNER_TEMP/deployment-request.json"

      - name: Upload closed request for trusted publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-request
          path: ${{ runner.temp }}/deployment-request.json
          if-no-files-found: error
          retention-days: 7
