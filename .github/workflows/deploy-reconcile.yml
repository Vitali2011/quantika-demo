name: Deploy reconciliation read-only

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download latest successful receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt_run=""
          while read -r run_id; do
            if [ "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.name == "deployment-receipt-quantika-demo" and .expired == false)] | length')" -gt 0 ]; then
              receipt_run="$run_id"
              break
            fi
          done < <(gh run list --workflow deploy.yml --status success --limit 50 \
            --json databaseId --jq '.[].databaseId')
          test -n "$receipt_run"
          gh run download "$receipt_run" \
            --name deployment-receipt-quantika-demo \
            --dir "$RUNNER_TEMP/receipt"

      - name: Read public production SHA
        run: |
          curl -fsS --max-time 15 https://demo.quantika.org/api/health \
            > "$RUNNER_TEMP/health.json"
          jq -er '.git_sha' "$RUNNER_TEMP/health.json" \
            > "$RUNNER_TEMP/production-sha.txt"

      - name: Compare main, receipt, and production
        run: |
          python3 ops/deploy_contract.py reconcile \
            --service quantika-demo \
            --main-sha "$(git rev-parse HEAD)" \
            --receipt "$RUNNER_TEMP/receipt/deployment-receipt.json" \
            --production-sha "$(tr -d '\n' < "$RUNNER_TEMP/production-sha.txt")" \
            | tee "$RUNNER_TEMP/reconciliation.json"
