name: Deploy to prod
# Triggered by repository_dispatch (event_type: prod-deploy) sent by
# auto-merge.yml → trigger-deploy job when a PR is squash-merged to main.
#
# Why repository_dispatch instead of on:push:
#   GitHub native auto-merge finalises the squash-merge from the
#   github-merge-queue[bot] account. GitHub's anti-recursion guard suppresses
#   all workflow triggers (push, pull_request, …) for events generated by bot
#   tokens. So on:push:main NEVER fires for auto-merged PRs.
#   repository_dispatch is an explicit API call from auto-merge.yml using
#   AUTO_REBASE_PAT and is exempt from the anti-recursion restriction.
#
# paths-ignore equivalent: auto-merge.yml/trigger-deploy does an in-job
#   git diff before dispatching — skips dispatch if only docs/config files
#   changed (docs/**, *.md, .claude/**, .github/**, .specs/**).
#   Mixed PRs (code + docs) trigger deploy (same semantics as before).
#
# workflow_dispatch: retained for manual deploys via Actions UI or CLI.
#
# SSH to outreach-vps under deploy-only key, invokes /root/deploy.sh
# dispatcher which routes to /root/deploy-quantika-demo.sh.
# Health check + auto-rollback live in deploy-quantika-demo.sh (60s window).
#
# Concurrency group (cancel-in-progress: false) behaviour:
#   Only ONE deploy runs at a time. While a deploy is in-flight, GitHub keeps
#   at most ONE additional run pending — a newer push discards the previous
#   pending run. Result: N code-touching merges in quick succession may produce
#   fewer than N deploy runs (the in-flight finishes, then the LATEST pending
#   fires). This is intentional: it avoids deploying stale intermediate commits
#   and prevents run stampedes. If you expect N deploys for N merges, use
#   cancel-in-progress: true instead (each merge gets its own slot, but earlier
#   ones get killed).

on:
  repository_dispatch:
    types: [prod-deploy]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH key + known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 185.249.225.169 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Trigger deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              root@185.249.225.169 \
              "quantika-demo ${{ github.sha }}"
      # Post-deploy seed guard: NOT called from here.
      # The SSH key uses a forced command: command="/root/deploy.sh $SSH_ORIGINAL_COMMAND"
      # which routes by service name. Sending "bash /path/to/script.sh" makes deploy.sh
      # receive "bash" as the service name → "ERROR: unknown service: bash".
      # Seed logic must live inside /root/deploy-quantika-demo.sh on the VPS (after the
      # health check, before exit). See docs/runbooks/post-deploy-seed.md for manual run
      # instructions and the VPS integration note.
      #
      # Post-deploy verify: DB checks (schema migrations, fx_rates, env vars) also run
      # inside /root/deploy-quantika-demo.sh via scripts/ops/verify-deploy.sh.
      # HTTP checks (4-5) run here from CI against the public URL.
      - name: Post-deploy verify (HTTP health)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          BASE_URL="https://demo.quantika.org"
          echo "[verify] GET ${BASE_URL}/api/health"
          curl -fsS --max-time 15 "${BASE_URL}/api/health" \
            || { echo "[verify] FAIL: /api/health did not return 200 — check VPS: pm2 status quantika-demo"; exit 1; }
          echo "[verify] /api/health OK"

          if [[ -n "${ADMIN_TOKEN:-}" ]]; then
            echo "[verify] GET ${BASE_URL}/api/admin/knowledge-status"
            curl -fsS --max-time 15 \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" \
              "${BASE_URL}/api/admin/knowledge-status" \
              || { echo "[verify] FAIL: /api/admin/knowledge-status — check ADMIN_TOKEN secret or app status"; exit 1; }
            echo "[verify] /api/admin/knowledge-status OK"
          else
            echo "[verify] SKIP: ADMIN_TOKEN secret not configured in GitHub Actions"
          fi
