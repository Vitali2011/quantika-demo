name: Deploy to prod

on:
  repository_dispatch:
    types: [prod-deploy]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact lowercase 40-hex commit on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-quantika-demo-prod
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false

      - name: Validate exact deployment request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            sha="$(python3 ops/deploy_contract.py validate-request \
              --expected-service quantika-demo \
              --payload-json "$CLIENT_PAYLOAD")"
          else
            sha="$(python3 ops/deploy_contract.py validate-request \
              --expected-service quantika-demo \
              --manual-sha "$MANUAL_SHA")"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 185.249.225.169 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy requested SHA
        env:
          REQUESTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              root@185.249.225.169 \
              "quantika-demo ${REQUESTED_SHA}" \
            | tee "$RUNNER_TEMP/deploy-output.log"

      - name: Require exact deployed SHA proof
        id: deployed
        env:
          REQUESTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          mapfile -t markers < <(
            sed -nE 's/^DEPLOY_RECEIPT_SHA=([0-9a-f]{40})$/\1/p' \
              "$RUNNER_TEMP/deploy-output.log"
          )
          test "${#markers[@]}" -eq 1
          test "${markers[0]}" = "$REQUESTED_SHA"
          echo "sha=${markers[0]}" >> "$GITHUB_OUTPUT"

      - name: Post-deploy public health check
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REQUESTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          base_url="https://demo.quantika.org"
          curl -fsS --max-time 15 "${base_url}/api/health" \
            > "$RUNNER_TEMP/public-health.json"
          production_sha="$(jq -er '.git_sha' "$RUNNER_TEMP/public-health.json")"
          test "$production_sha" = "$REQUESTED_SHA"
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            curl -fsS --max-time 15 \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" \
              "${base_url}/api/admin/knowledge-status" >/dev/null
          fi

      - name: Create closed deployment receipt
        run: |
          python3 ops/deploy_contract.py create-receipt \
            --service quantika-demo \
            --requested-sha "${{ steps.request.outputs.sha }}" \
            --deployed-sha "${{ steps.deployed.outputs.sha }}" \
            --run-id "${{ github.run_id }}" \
            > "$RUNNER_TEMP/deployment-receipt.json"

      - name: Upload deployment receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipt-quantika-demo
          path: ${{ runner.temp }}/deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
