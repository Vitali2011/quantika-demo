    notes: >
      Houthi ceasefire Oct 2025 led to rate reduction from peak 0.7-1.0% to approx 0.2% of hull
      value per transit (S&P Global Dec 2025 / FreightAmigo 2025 reporting). "Brittle calm" — risk
      of re-escalation maintained. Zone covers Red Sea south of 18°N including Bab el-Mandeb.
      Hold (at-anchor) rate not publicly available — requires underwriter negotiation.
      Industry estimates pre-ceasefire: 0.5-1.0% transit, 0.3-0.6% hold (Lloyd's List 2025-Q3).

