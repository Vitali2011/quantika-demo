bulletin_ref: JWLA-033
notes: >
  Latest bulletin JWLA-033 published 3 March 2026, effective 12 March 2026 (00:01 GMT).
  Adds Bahrain, Djibouti, Kuwait, Oman, Qatar as listed areas.
  Amends Persian/Arabian Gulf, Gulf of Oman, Indian Ocean, Gulf of Aden and Southern Red Sea
  zone with revised boundary coordinates.
  JWC does not publish rates — these are negotiated between underwriters and brokers individually.
  Rate estimates sourced from S&P Global (Dec 2025), Bloomberg (Dec 2025), Insurance Journal (Dec 2025),
  and Lloyd's List reporting.

